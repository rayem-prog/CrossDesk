name: CrossDesk native builds
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'scripts/**', '*.command', '*.cmd', '*.md', 'Cargo.*', 'build.rs', '.github/workflows/crossdesk-input.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', '*.command', '*.cmd', '*.md', 'Cargo.*', 'build.rs', '.github/workflows/crossdesk-input.yml']
jobs:
  native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: Windows-x64
            binary: crossdesk.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            package: Mac-ARM64
            binary: crossdesk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo test --locked --no-default-features
      - name: Test native Windows clipboard on disposable runner
        if: runner.os == 'Windows'
        run: cargo test --locked --no-default-features native_windows_image_and_file_clipboard_round_trip -- --ignored
      - run: cargo build --release --locked --no-default-features --target ${{ matrix.target }}
      - name: Verify large streaming file transfer
        run: cargo test --release --locked --no-default-features large_file_stream_exceeds_image_batch_limit_without_buffering_the_file -- --ignored
      - name: Package binary, launch scripts and corresponding source
        run: python3 scripts/package_input.py --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --platform ${{ matrix.package }} --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: CrossDesk-${{ matrix.package }}
          path: dist/*.zip
