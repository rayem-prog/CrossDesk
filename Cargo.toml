[package]
name = "crossdesk"
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = []
pairing = ["dep:spake2", "dep:hkdf"]
discovery = ["dep:mdns-sd"]
gui = ["pairing", "discovery", "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-dialog", "dep:tauri-plugin-autostart", "dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
unicode-normalization = "0.1"
spake2 = { version = "=0.4.0", optional = true }
hkdf = { version = "0.12", optional = true }
mdns-sd = { version = "0.21", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri = { version = "2", default-features = true, optional = true , features = ["tray-icon"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
getrandom = "0.2"
ctrlc = { version = "3.4", features = ["termination"] }
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
sha2 = "0.10"
subtle = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2", features = [], optional = true }
